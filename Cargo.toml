[package]
name = "biject_obj"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7.0"
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "audio", "dynamic_linking", "debug"] }
bitvec = "1.1.1"
ndshape = { git = "https://github.com/larsraph/ndshape-rs" }
rand = "0.10.2"
sparse_linear_assignment = { version = "0.1.5", default-features = false, features = ["khosla"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
